name: Build docker s6-overlay rootfs image

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      target:
        description: 'Bake target or group to build (e.g. all, default, 3_2_3_2)'
        required: true
        default: 'all'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: checkout code
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          config-inline: |
            [worker.oci]
              max-parallelism = 16
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.PAT_TOKEN}}
      - name: Build and push
        uses: docker/bake-action@v7.2.0
        with:
          files: hack/docker-bake.hcl
          targets: ${{ github.event_name == 'release' && 'default' || github.event.inputs.target }}
          push: true
