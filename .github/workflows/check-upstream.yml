name: Check Upstream Releases

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Specific s6-overlay version to build (optional, e.g. 3.2.0.3)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check-and-build:
    name: Check, Build & Verify Upstream Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for pending work (Gating)
        id: gate_check
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
        run: ./hack/check-upstream-src/gate-check.sh

      - name: Resolve target version
        if: steps.gate_check.outputs.proceed == 'true'
        id: resolve_version
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
          MANUAL_VERSION: ${{ github.event.inputs.version }}
        run: ./hack/check-upstream-src/resolve-version.sh

      - name: Set up Docker Buildx
        if: steps.gate_check.outputs.proceed == 'true' && steps.resolve_version.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Apply version updates with Perl
        if: steps.gate_check.outputs.proceed == 'true' && steps.resolve_version.outputs.skip == 'false'
        id: update_code
        env:
          VERSION: ${{ steps.resolve_version.outputs.version }}
        run: ./hack/update-version.pl "${VERSION}"

      - name: Build & Run Downstream Test Harness
        if: steps.gate_check.outputs.proceed == 'true' && steps.resolve_version.outputs.skip == 'false'
        id: test_build
        env:
          VERSION: ${{ steps.resolve_version.outputs.version }}
        run: ./hack/check-upstream-src/test-build.sh

      - name: Handle Failure (Create Issue for Manual Intervention)
        if: failure() && steps.gate_check.outputs.proceed == 'true' && steps.resolve_version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve_version.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./hack/check-upstream-src/handle-failure.sh

      - name: Import GPG Key
        if: success() && steps.gate_check.outputs.proceed == 'true' && steps.resolve_version.outputs.skip == 'false'
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.BOT_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
        continue-on-error: true

      - name: Commit, Push & Create Pull Request
        if: success() && steps.gate_check.outputs.proceed == 'true' && steps.resolve_version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve_version.outputs.version }}
          GPG_OUTCOME: ${{ steps.import_gpg.outcome }}
        run: ./hack/check-upstream-src/create-pr.sh
